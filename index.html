<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <div class="wrapper">
    <header>
      <h1>Kraft</h1>
      <button id="themeToggle" aria-label="Switch theme">Switch Theme</button>
    </header>

    <main>
      <section class="panel upload-panel" aria-label="Upload">
        <h2>Upload Document</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <label for="fileInput" class="drop-label" id="dropArea">
            <div class="drop-text" id="dropText">Drop .txt / .pdf / .docx / .pptx here or click</div>
            <div class="file-preview" id="filePreview" hidden aria-live="polite">
              <svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              <span id="selectedFileName" class="file-name"></span>
            </div>
            <input id="fileInput" type="file" accept=".txt,.pdf,.docx,.doc,.pptx" required />
          </label>

          <div class="filter-area" aria-label="Filter bubbles">
            <label for="filterInput">Exclude keywords (hit Enter for bubbles):</label>
            <div class="bubble-input-wrap">
              <input id="filterInput" type="text" placeholder="type keyword and press Enter" autocomplete="off" />
            </div>
            <div id="bubbles" class="bubbles" aria-live="polite" aria-label="Excluded keywords"></div>
            <input type="hidden" id="unwantedWords" name="unwanted_words_json" value="[]" />
          </div>

          <button type="submit" class="btn-primary">Extract Keywords</button>
        </form>
      </section>

      <section class="panel results-panel" aria-label="Results" hidden>
        <h2>Results</h2>
        <div id="fileName" class="file-meta"></div>
        <div id="keywords" class="keywords-grid"></div>
        <div class="score-legend">* Score = keyword relevance % from YAKE (higher = more important).</div>
      </section>
    </main>

    <footer>
      <p>FastAPI + YAKE • Ports <strong>8000</strong> inside Docker</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
